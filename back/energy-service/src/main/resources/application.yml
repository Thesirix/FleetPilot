server:
  port: 8090
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: energy-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_energy}
    username: ${DB_USER:fleetpilot}
    password: ${DB_PASSWORD:fleetpilot}
    hikari:
      maximum-pool-size: 8
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/certs}
          audiences: fleetpilot-api
      # The energy service reads the fleet and its usage as itself (client_credentials)
      client:
        registration:
          fleetpilot-services:
            provider: keycloak
            client-id: fleetpilot-services
            client-secret: ${SERVICES_CLIENT_SECRET:dev-fleetpilot-services-secret}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/token}
  data:
    web:
      pageable:
        max-page-size: 100

fleetpilot:
  oidc:
    public-issuer-uri: ${OIDC_PUBLIC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
  services:
    vehicle-url: ${VEHICLE_SERVICE_URL:http://localhost:8081}
    telemetry-url: ${TELEMETRY_SERVICE_URL:http://localhost:8086}
  energy:
    # Prices including VAT (October 2026) and CO2 of the French electricity mix (ADEME, kg per kWh)
    prices:
      diesel: 1.72
      petrol: 1.81
      lpg: 1.00
      cng: 1.45
      depot-kwh: 0.20
      public-kwh: 0.45
    grid-kg-co2-per-kwh: 0.052

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: FleetPilot energy-service
    description: Energy transition, electric eligibility, cost and CO2, low emission zones

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    oauth:
      client-id: fleetpilot-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.fleetpilot: INFO
