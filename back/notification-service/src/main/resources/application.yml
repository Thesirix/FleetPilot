server:
  port: 8084
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_notification}
    username: ${DB_USER:fleetpilot}
    password: ${DB_PASSWORD:fleetpilot}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/certs}
          audiences: fleetpilot-api
      client:
        registration:
          fleetpilot-services:
            provider: keycloak
            client-id: fleetpilot-services
            client-secret: ${SERVICES_CLIENT_SECRET:dev-fleetpilot-services-secret}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/token}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  activemq:
    broker-url: ${ACTIVEMQ_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_USER:admin}
    password: ${ACTIVEMQ_PASSWORD:admin}
  jms:
    listener:
      # Transacted sessions: a failure rolls the message back and the broker delivers it again
      session:
        transacted: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  thymeleaf:
    check-template-location: false

fleetpilot:
  oidc:
    public-issuer-uri: ${OIDC_PUBLIC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
  services:
    vehicle-url: ${VEHICLE_SERVICE_URL:http://localhost:8081}
    quote-url: ${QUOTE_SERVICE_URL:http://localhost:8083}
  outbox:
    relay:
      enabled: false
  notifications:
    from-address: noreply@fleetpilot.dev
    from-name: FleetPilot
    team-address: ${TEAM_ADDRESS:gestion-flotte@fleetpilot.dev}
    team-name: Équipe de gestion de flotte
    portal-url: ${PORTAL_URL:http://localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: FleetPilot notification-service
    description: E-mails and documents sent by FleetPilot

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    oauth:
      client-id: fleetpilot-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid

logging:
  level:
    com.fleetpilot: INFO
    org.apache.kafka: WARN
