<!DOCTYPE html>
<!--/* Small building blocks shared by the e-mail templates. */-->
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<body>

<!-- Main action, as a button -->
<a th:fragment="button(href, label)" th:href="${href}" th:text="${label}" href="#"
   style="display:inline-block;padding:10px 18px;border-radius:8px;background:#0f766e;color:#ffffff;
          font-weight:bold;text-decoration:none;">Action</a>

<!-- Key and value lines -->
<table th:fragment="facts(rows)" role="presentation" cellpadding="0" cellspacing="0" width="100%"
       style="margin:16px 0;border:1px solid #e3e6eb;border-radius:8px;">
  <tr th:each="row, it : ${rows}">
    <td th:text="${row[0]}" style="padding:9px 14px;color:#667085;font-size:13px;width:45%;"
        th:styleappend="${!it.last} ? 'border-bottom:1px solid #e3e6eb;' : ''">Clé</td>
    <td th:text="${row[1]}" style="padding:9px 14px;font-size:13px;font-weight:bold;"
        th:styleappend="${!it.last} ? 'border-bottom:1px solid #e3e6eb;' : ''">Valeur</td>
  </tr>
</table>

<!-- A remark in a box -->
<p th:fragment="note(text)" th:text="${text}"
   style="margin:16px 0;padding:10px 14px;border-left:3px solid #0f766e;background:#f9fafb;color:#475467;
          font-size:13px;">Note</p>

</body>
</html>
