server:
  port: 8088
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: integration-esb
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet_integration}
    username: ${DB_USER:fleetpilot}
    password: ${DB_PASSWORD:fleetpilot}
    hikari:
      maximum-pool-size: 8
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/certs}
          audiences: fleetpilot-api
      # The bus calls the business services as itself (client_credentials)
      client:
        registration:
          fleetpilot-services:
            provider: keycloak
            client-id: fleetpilot-services
            client-secret: ${SERVICES_CLIENT_SECRET:dev-fleetpilot-services-secret}
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            token-uri: ${OIDC_TOKEN_URI:http://localhost:8180/realms/fleetpilot/protocol/openid-connect/token}
  data:
    web:
      pageable:
        max-page-size: 100

camel:
  main:
    name: fleetpilot-esb
    # Keeps the application running and stops the routes cleanly, finishing the files in progress
    shutdown-timeout: 20
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

fleetpilot:
  oidc:
    public-issuer-uri: ${OIDC_PUBLIC_ISSUER_URI:http://localhost:8180/realms/fleetpilot}
  services:
    vehicle-url: ${VEHICLE_SERVICE_URL:http://localhost:8081}
    quote-url: ${QUOTE_SERVICE_URL:http://localhost:8083}
  integration:
    # Folders where the partners drop their files (one per flow), as on an SFTP server
    inbox: ${INTEGRATION_INBOX:./data/inbox}
    # First delay before retrying a call to a service in error (then doubled at each attempt)
    redelivery-delay: 2000
    # Publication of the fuel transactions on Kafka (fuel.transactions), for the analytics pipeline
    fuel-events-enabled: true
    insurer:
      # The insurer's claims API; locally the bus plays the insurer itself under /partners/insurer
      url: ${INSURER_URL:http://localhost:8088/partners/insurer}
      api-key: ${INSURER_API_KEY:dev-insurer-key}
      # Kafka consumer of the declared claims (off in the tests, which call the route directly)
      declarations-enabled: true
      follow-up-delay: 15000
      follow-up-interval: 60000
      # How fast the simulated insurer handles a claim: expert report, agreement, settlement (minutes)
      expertise-after: 3
      agreement-after: 8
      settlement-after: 20
  demo-data:
    enabled: ${DEMO_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: FleetPilot integration-esb
    description: Partner flows (garages, lessors, insurer, fuel cards) on Apache Camel

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    oauth:
      client-id: fleetpilot-swagger
      use-pkce-with-authorization-code-grant: true
      scopes: openid
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.fleetpilot: INFO
    org.apache.kafka: WARN
