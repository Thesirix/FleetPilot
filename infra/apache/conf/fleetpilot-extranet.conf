# Apache httpd in front of the Tomcat of the lessor extranet (legacy-portal-war).
# Apache serves the static files cached, compresses, adds the security headers, logs, and forwards the rest to
# Tomcat over HTTP on the Docker network. Tomcat is never exposed directly.

ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# The address of the browser for the logs (the X-Forwarded-For of a load balancer in front, if any)
RemoteIPHeader X-Forwarded-For
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t%{%z}t\",\"client\":\"%a\",\"method\":\"%m\",\"path\":\"%U\",\"status\":%>s,\"bytes\":%B,\"duration_us\":%D}" json
CustomLog /proc/self/fd/1 json
ErrorLog /proc/self/fd/2

<VirtualHost *:80>
    # The extranet lives under /extranet, as it always did
    RedirectMatch 302 ^/$ /extranet/
    RedirectMatch 301 ^/extranet$ /extranet/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self' http://localhost:8180; frame-ancestors 'none'"

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /extranet/ http://tomcat:8080/extranet/ connectiontimeout=5 timeout=30 retry=2
    ProxyPassReverse /extranet/ http://tomcat:8080/extranet/
    ProxyPassReverseCookiePath /extranet /extranet

    # Stylesheet and logo: cached a day by the browser
    <LocationMatch "^/extranet/static/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    AddOutputFilterByType DEFLATE text/html text/css text/csv image/svg+xml application/json

    # Tomcat down: a clear page instead of the default 503 of Apache
    ErrorDocument 503 /maintenance.html
    ProxyPass /maintenance.html !
    Alias /maintenance.html /usr/local/apache2/htdocs/maintenance.html
    <Location /maintenance.html>
        # A standalone page (Tomcat is down): its own small inline style, nothing else
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'"
    </Location>

    # Health check of the container: Apache itself, without Tomcat
    ProxyPass /healthz !
    Alias /healthz /usr/local/apache2/htdocs/healthz.txt
</VirtualHost>
