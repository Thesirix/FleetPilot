# Journaux de tous les conteneurs FleetPilot, collectés par Filebeat, analysés ici, indexés dans Elasticsearch.
#  - services Spring Boot : une ligne JSON au format ECS (niveau, logger, identifiant de corrélation...)
#  - Nginx : une ligne JSON par requête (méthode, chemin, statut, durée, service appelé, corrélation)
#  - les autres (Keycloak, Kafka, PostgreSQL...) : le texte tel quel

input {
  beats {
    port => 5044
  }
}

filter {
  mutate {
    add_field => { "[service][name]" => "%{[container][labels][com_docker_compose_service]}" }
  }

  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }

  if [parsed][ecs.version] or [parsed][ecs][version] {
    # Spring Boot (structured logging ECS): the event takes the fields of the application
    ruby {
      code => '
        parsed = event.get("parsed")
        level = parsed["log.level"] || (parsed["log"] && parsed["log"]["level"])
        logger = parsed["log.logger"] || (parsed["log"] && parsed["log"]["logger"])
        event.set("[log][level]", level.to_s.upcase) if level
        event.set("[log][logger]", logger) if logger
        event.set("message", parsed["message"]) if parsed["message"]
        event.set("[process][thread][name]", parsed["process.thread.name"]) if parsed["process.thread.name"]
        cid = parsed["correlationId"] || parsed["correlation_id"]
        event.set("[trace][correlation_id]", cid) if cid
        trace = parsed["error.stack_trace"] || (parsed["error"] && parsed["error"]["stack_trace"])
        event.set("[error][stack_trace]", trace) if trace
        etype = parsed["error.type"] || (parsed["error"] && parsed["error"]["type"])
        event.set("[error][type]", etype) if etype
        ts = parsed["@timestamp"]
        event.set("@timestamp", LogStash::Timestamp.parse_iso8601(ts)) if ts
      '
    }
    mutate { add_field => { "[event][dataset]" => "fleetpilot.application" } }
  } else if [parsed][uri] and [parsed][status] {
    # Nginx: access log of the single entry point
    mutate {
      add_field => {
        "[event][dataset]" => "nginx.access"
        "[http][request][method]" => "%{[parsed][method]}"
        "[url][path]" => "%{[parsed][uri]}"
        "[http][response][status_code]" => "%{[parsed][status]}"
        "[event][duration_seconds]" => "%{[parsed][duration]}"
        "[nginx][upstream]" => "%{[parsed][upstream]}"
        "[trace][correlation_id]" => "%{[parsed][correlation_id]}"
      }
    }
    # the route without its identifiers: /api/v1/vehicles/{id}/mileage, so that the requests of a route add up
    mutate {
      copy => { "[url][path]" => "[url][route]" }
    }
    mutate {
      gsub => [
        "[url][route]", "\?.*$", "",
        "[url][route]", "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", "{id}",
        "[url][route]", "/[A-Z]{2}-[0-9]{3}-[A-Z]{2}(?=/|$)", "/{immatriculation}",
        "[url][route]", "/[0-9]+(?=/|$)", "/{n}"
      ]
    }
    mutate {
      convert => {
        "[http][response][status_code]" => "integer"
        "[event][duration_seconds]" => "float"
      }
    }
    if [http][response][status_code] >= 500 {
      mutate { add_field => { "[log][level]" => "ERROR" } }
    } else if [http][response][status_code] >= 400 {
      mutate { add_field => { "[log][level]" => "WARN" } }
    } else {
      mutate { add_field => { "[log][level]" => "INFO" } }
    }
    mutate { replace => { "message" => "%{[parsed][method]} %{[parsed][uri]} %{[parsed][status]}" } }
  } else {
    mutate { add_field => { "[event][dataset]" => "fleetpilot.infrastructure" } }
    if [message] =~ /(?i)\b(error|fatal|exception)\b/ {
      mutate { add_field => { "[log][level]" => "ERROR" } }
    } else if [message] =~ /(?i)\bwarn(ing)?\b/ {
      mutate { add_field => { "[log][level]" => "WARN" } }
    } else {
      mutate { add_field => { "[log][level]" => "INFO" } }
    }
  }

  mutate {
    remove_field => [ "parsed", "agent", "ecs", "input", "[event][original]", "log.offset", "[log][offset]", "[log][file]", "stream" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fleetpilot-logs-%{+YYYY.MM.dd}"
    # The index template is installed before the first event: a daily index created without it would map the
    # service, the level and the route as text, which the dashboards cannot aggregate
    manage_template => true
    template_api => "composable"
    template_name => "fleetpilot-logs"
    template => "/usr/share/logstash/templates/logs-template.json"
    template_overwrite => true
  }
}
