# Single entry point of FleetPilot on http://localhost
#   /            web portal (static PWA built by Nuxt)
#   /graphql     GraphQL gateway (portal)
#   /api/v1/     REST APIs: quotes, garages and tariff (quote service), notifications, reports and indicators,
#                telemetry and alerts (with the live stream, unbuffered), partner flows and fuel cards (bus),
#                energy transition,
#                everything else (fleet service)
# Every request gets a correlation id, logged here and propagated to the services.

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

log_format fleetpilot escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
    '"status":$status,"duration":$request_time,"upstream":"$upstream_addr","correlation_id":"$correlation_id"}';

# The services are found through the DNS of Docker and resolved again while Nginx runs: a container recreated with
# a new address (docker compose up after a build) is reached without restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream graphql_gateway { zone upstreams 256k; server graphql-gateway:8082 resolve; keepalive 16; }
upstream vehicle_service { zone upstreams; server vehicle-service:8081 resolve; keepalive 16; }
upstream quote_service { zone upstreams; server quote-service:8083 resolve; keepalive 16; }
upstream notification_service { zone upstreams; server notification-service:8084 resolve; keepalive 16; }
upstream reporting_service { zone upstreams; server reporting-service:8085 resolve; keepalive 16; }
upstream telemetry_service { zone upstreams; server telemetry-service:8086 resolve; keepalive 16; }
upstream integration_esb { zone upstreams; server integration-esb:8088 resolve; keepalive 16; }
upstream energy_service { zone upstreams; server energy-service:8090 resolve; keepalive 16; }

server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log fleetpilot;

    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-Id $correlation_id;

    # Health check of the container: answered here, kept out of the access log
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location = /graphql {
        proxy_pass http://graphql_gateway/graphql;
    }

    location ~ ^/api/v1/(quotes|garages|tariff)(/|$) {
        proxy_pass http://quote_service;
    }

    location ~ ^/api/v1/notifications(/|$) {
        proxy_pass http://notification_service;
    }

    location ~ ^/api/v1/(reports|indicators)(/|$) {
        proxy_pass http://reporting_service;
    }

    # Server-Sent Events: every event goes to the browser at once, the connection stays open
    location = /api/v1/telemetry/stream {
        proxy_pass http://telemetry_service;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location ~ ^/api/v1/(telemetry|alerts)(/|$) {
        proxy_pass http://telemetry_service;
    }

    location ~ ^/api/v1/(integration|fuel)(/|$) {
        proxy_pass http://integration_esb;
    }

    location ~ ^/api/v1/energy(/|$) {
        proxy_pass http://energy_service;
    }

    location /api/v1/ {
        proxy_pass http://vehicle_service/api/v1/;
    }

    root /usr/share/nginx/html;

    # Fingerprinted assets: cached for a year
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker and the manifest must always be fresh
    location ~ ^/(sw\.js|sw-notifications\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Single-page application: every route is served by index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
